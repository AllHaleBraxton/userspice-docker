networks:
  www_network:
    external: true
  userspice_network:
    name: userspice_network
    driver: bridge
    ipam:
      config:
        - subnet: 199.199.1.0/24

services:
  apache:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: userspice-apache
    ports:
      - "${APACHE_PORT}:80"
    volumes:
      - ${USERSPICE_DIR}/www:/var/www/html
      - apache_config:/etc/apache2
    networks:
      - www_network
      - userspice_network
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: userspice-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ${USERSPICE_DIR}/sql/sql.sql:/docker-entrypoint-initdb.d/sql.sql
    networks:
      - userspice_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: userspice-phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - userspice_network
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  userspice-apache:
