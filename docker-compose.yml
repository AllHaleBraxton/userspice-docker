version: '3.7'

services:
  apache:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: userspice-apache
    ports:
      - "${APACHE_PORT}:80"
    volumes:
      - ${USERSPICE_DIR}/www:/var/www/html
    command: >
      sh -c "
      a2enmod remoteip &&
      echo '<IfModule mod_remoteip.c>' > /etc/apache2/conf-available/remoteip.conf &&
      echo '  RemoteIPHeader X-Forwarded-For' >> /etc/apache2/conf-available/remoteip.conf &&
      echo '  RemoteIPInternalProxy 199.1.1.100' >> /etc/apache2/conf-available/remoteip.conf &&
      echo '</IfModule>' >> /etc/apache2/conf-available/remoteip.conf &&
      a2enconf remoteip &&
      apache2-foreground
      "
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: userspice-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ${USERSPICE_DIR}/sql/sql.sql:/docker-entrypoint-initdb.d/sql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: userspice-phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
